[package]
name = "sys1-modernbert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ModernBERT encoder shared by rust-sys1 model families"
readme = "README.md"

[dependencies]
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
serde.workspace = true
serde_json.workspace = true

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
