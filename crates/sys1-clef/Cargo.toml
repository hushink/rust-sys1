[package]
name = "sys1-clef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Clef joint-schema decision model for rust-sys1"
readme = "README.md"

[dependencies]
sys1-core = { path = "../sys1-core" }
sys1-protocol = { path = "../sys1-protocol" }
sys1-qwen = { path = "../sys1-qwen" }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
cuda = ["sys1-qwen/cuda", "candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "sys1-qwen/cudnn", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["sys1-qwen/metal", "candle-core/metal", "candle-nn/metal"]
accelerate = ["sys1-qwen/accelerate", "candle-core/accelerate", "candle-nn/accelerate"]
