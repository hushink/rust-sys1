[package]
name = "sys1-laya"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Clean-room Laya decision model implementation for rust-sys1"
readme = "README.md"

[dependencies]
sys1-core = { path = "../sys1-core" }
sys1-protocol = { path = "../sys1-protocol" }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true
tracing.workspace = true

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
