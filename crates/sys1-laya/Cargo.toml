[package]
name = "sys1-laya"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Clean-room Laya decision model implementation for rust-sys1"
readme = "README.md"

[dependencies]
sys1-core = { path = "../sys1-core" }
sys1-protocol = { path = "../sys1-protocol" }
sys1-modernbert = { path = "../sys1-modernbert" }
sys1-ort = { path = "../sys1-ort", optional = true }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
unicode-general-category = "1.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "onnx_load"
required-features = ["onnx"]

[features]
default = []
onnx = ["dep:sys1-ort"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
ort-cuda = ["onnx", "sys1-ort/cuda"]
ort-tensorrt = ["onnx", "sys1-ort/tensorrt"]
ort-directml = ["onnx", "sys1-ort/directml"]
ort-coreml = ["onnx", "sys1-ort/coreml"]
