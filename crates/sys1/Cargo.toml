[package]
name = "sys1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Type-safe in-process System One inference and TypeSafe-compatible serving"
readme = "README.md"

[dependencies]
sys1-core = { path = "../sys1-core" }
sys1-protocol = { path = "../sys1-protocol" }
sys1-hub = { path = "../sys1-hub", optional = true }
sys1-laya = { path = "../sys1-laya", optional = true }
sys1-families = { path = "../sys1-families", optional = true }
sys1-ort = { path = "../sys1-ort", optional = true }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
sys1-qwen3guard = { path = "../sys1-qwen3guard" }

[features]
default = ["laya", "hub", "families"]
laya = ["dep:sys1-laya"]
hub = ["dep:sys1-hub"]
families = ["dep:sys1-families"]
onnx = ["dep:sys1-ort", "sys1-laya?/onnx", "sys1-families?/onnx"]
cuda = ["sys1-laya?/cuda", "sys1-families?/cuda"]
cudnn = ["sys1-laya?/cudnn", "sys1-families?/cudnn"]
metal = ["sys1-laya?/metal", "sys1-families?/metal"]
accelerate = ["sys1-laya?/accelerate", "sys1-families?/accelerate"]
ort-cuda = ["onnx", "sys1-laya?/ort-cuda"]
ort-tensorrt = ["onnx", "sys1-laya?/ort-tensorrt"]
ort-directml = ["onnx", "sys1-laya?/ort-directml"]
ort-coreml = ["onnx", "sys1-laya?/ort-coreml"]
