[package]
name = "sys1-von"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Von 1.1 option-marker decision model for rust-sys1"
readme = "README.md"

[dependencies]
sys1-core = { path = "../sys1-core" }
sys1-protocol = { path = "../sys1-protocol" }
sys1-modernbert = { path = "../sys1-modernbert" }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
cuda = ["sys1-modernbert/cuda", "candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "sys1-modernbert/cudnn", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["sys1-modernbert/metal", "candle-core/metal", "candle-nn/metal"]
accelerate = ["sys1-modernbert/accelerate", "candle-core/accelerate", "candle-nn/accelerate"]
