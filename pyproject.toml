[project]
name = "rust-sys1-python"
version = "0.1.0"
description = "uv workspace for the rust-sys1 Python tooling"
requires-python = ">=3.10,<3.15"
dependencies = ["sys1-tools"]

[project.optional-dependencies]
onnx = ["sys1-tools[onnx]"]
check = ["sys1-tools[check]"]
all = ["sys1-tools[all]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
sys1-tools = { workspace = true }
